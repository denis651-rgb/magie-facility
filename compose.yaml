services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: magie_facility
      POSTGRES_USER: magie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "magie", "-d", "magie_facility"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
